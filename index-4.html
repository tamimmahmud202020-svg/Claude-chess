<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Regal Chess — Offline Chess</title>
<meta name="description" content="A premium, fully offline chess game. Play the computer or a friend, solve puzzles, learn the rules. Installable as an app.">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Regal Chess">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
/* ===================== TOKENS ===================== */
:root {
  --bg0: #080c18; --bg1: #101732; --bg2: #18204a;
  --panel: rgba(255, 255, 255, .06); --panel2: rgba(255, 255, 255, .1); --panel-solid: #161d3a; --stroke: rgba(255, 255, 255, .11);
  --text: #eef1fa; --muted: #97a2c4; --accent: #f5c542; --accent-d: #d99a12; --accent2: #7b93ff;
  --good: #3fbf8f; --bad: #ff6b6b; --warn: #f0a23a;
  --shadow: 0 18px 50px rgba(0, 0, 0, .45);
  --sq-l: #f0d9b5; --sq-d: #b58863; --frame: #6b4a2f; --anim: 220ms;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Noto Sans Bengali", "Kalpurush", "SolaimanLipi", "Nirmala UI", "Vrinda", "Helvetica Neue", Arial, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Noto Serif Bengali", serif;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg0: #e9edf7; --bg1: #f6f8fd; --bg2: #dfe6f8;
  --panel: rgba(255, 255, 255, .72); --panel2: rgba(255, 255, 255, .92); --panel-solid: #ffffff; --stroke: rgba(30, 40, 80, .13);
  --text: #182038; --muted: #5d6888; --accent: #d79a0b; --accent-d: #b57d00; --accent2: #4a63e0;
  --shadow: 0 14px 40px rgba(40, 55, 110, .18);
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font); color: var(--text); background: var(--bg0); overflow: hidden; overscroll-behavior: none; -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { opacity: .4; cursor: default; }
:focus-visible { outline: 2.5px solid var(--accent2); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.glass { background: var(--panel); border: 1px solid var(--stroke); backdrop-filter: blur(16px) saturate(1.3); -webkit-backdrop-filter: blur(16px) saturate(1.3); box-shadow: 0 6px 24px rgba(0, 0, 0, .18); }
.muted { color: var(--muted); } .c { text-align: center; }

/* ===================== PIECE STYLES ===================== */
.pp { fill: var(--pf); stroke: var(--ps); stroke-width: var(--psw, 2.4); stroke-linejoin: round; stroke-linecap: round; }
.pd { fill: none; stroke: var(--pe); stroke-width: 2; stroke-linecap: round; }
.pe { fill: var(--pe); stroke: none; }
.pcv { display: block; width: 100%; height: 100%; transition: transform var(--anim); }
:root[data-pieces="glossy"] .pc-w { --pf: url(#gW); --ps: #2b3350; --pe: #2b3350; }
:root[data-pieces="glossy"] .pc-b { --pf: url(#gB); --ps: #04060b; --pe: #a3acce; }
:root[data-pieces="glossy"] .pcv { filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .42)); }
:root[data-pieces="flat"] .pc-w { --pf: #f7f3ea; --ps: #2a2f3d; --pe: #2a2f3d; }
:root[data-pieces="flat"] .pc-b { --pf: #2c3246; --ps: #0b0d14; --pe: #b2bbdb; }
:root[data-pieces="flat"] .pcv { filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .3)); }
:root[data-pieces="neon"] .pc-w { --pf: rgba(110, 215, 255, .2); --ps: #8fe6ff; --pe: #8fe6ff; --psw: 2.8; }
:root[data-pieces="neon"] .pc-b { --pf: rgba(255, 110, 215, .18); --ps: #ff8fe6; --pe: #ff8fe6; --psw: 2.8; }
:root[data-pieces="neon"] .pcv { filter: drop-shadow(0 0 4px rgba(0, 0, 0, .8)); }
:root[data-pieces="neon"][data-theme="light"] .pc-w { --pf: rgba(20, 140, 200, .15); --ps: #0a86c4; --pe: #0a86c4; }
:root[data-pieces="neon"][data-theme="light"] .pc-b { --pf: rgba(200, 30, 150, .14); --ps: #c0188f; --pe: #c0188f; }
/* flat/neon stay legible in the UI chrome */
.pb-av .pcv, .logo-mark .pcv { filter: none; }

/* ===================== SCREENS ===================== */
.screen { position: fixed; inset: 0; overflow-y: auto; overflow-x: hidden; background: radial-gradient(1200px 800px at 15% -10%, var(--bg2), transparent 60%), radial-gradient(900px 700px at 100% 110%, rgba(123, 147, 255, .12), transparent 60%), linear-gradient(180deg, var(--bg1), var(--bg0)); padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
.screen.enter { animation: fadeUp .38s ease both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.icon-btn { width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--stroke); background: var(--panel); display: grid; place-items: center; transition: transform .15s, background .2s; }
.icon-btn:hover { background: var(--panel2); } .icon-btn:active { transform: scale(.94); }
.chip-btn { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--stroke); background: var(--panel); font-weight: 600; }
.btn { min-height: 46px; padding: 0 18px; border-radius: 14px; border: 1px solid var(--stroke); background: var(--panel2); font-weight: 650; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .12s, filter .2s; }
.btn:hover { filter: brightness(1.12); } .btn:active { transform: scale(.97); }
.btn.primary { background: linear-gradient(180deg, #ffd666, var(--accent-d)); color: #1d1500; border-color: transparent; box-shadow: 0 6px 20px rgba(245, 197, 66, .3); }
.btn.primary.big { min-height: 52px; font-size: 17px; flex: 1; }
.btn.ghost { background: transparent; }
.btn.danger { background: rgba(255, 107, 107, .16); color: var(--bad); border-color: rgba(255, 107, 107, .35); }
.btn.small { min-height: 40px; padding: 0 14px; font-size: 14px; }
.btn.file { cursor: pointer; }
.btn svg { width: 18px; height: 18px; }

/* ===================== HOME ===================== */
#home { display: block; }
.home-bg { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.orb { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .5; animation: drift 18s ease-in-out infinite alternate; }
.o1 { width: 340px; height: 340px; background: #5568ff; left: -90px; top: 8%; }
.o2 { width: 300px; height: 300px; background: #f5c542; opacity: .22; right: -80px; top: 46%; animation-delay: -6s; }
.o3 { width: 260px; height: 260px; background: #b455ff; opacity: .28; left: 30%; bottom: -80px; animation-delay: -11s; }
@keyframes drift { to { transform: translate(40px, -30px) scale(1.12); } }
.fl { position: absolute; width: 90px; height: 90px; opacity: .07; animation: floaty 9s ease-in-out infinite alternate; }
.f1 { left: 6%; top: 18%; } .f2 { right: 8%; top: 12%; animation-delay: -3s; width: 110px; height: 110px; } .f3 { left: 10%; bottom: 14%; animation-delay: -5s; } .f4 { right: 12%; bottom: 20%; animation-delay: -2s; width: 100px; height: 100px; }
.fl .pcv { filter: none !important; }
@keyframes floaty { to { transform: translateY(-26px) rotate(8deg); } }
.home-top { position: relative; z-index: 2; display: flex; justify-content: space-between; padding: 12px 14px 0; }
.home-inner { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 6px 18px 28px; display: flex; flex-direction: column; gap: 16px; }
.logo { text-align: center; padding-top: 4px; }
.logo-mark { width: 86px; height: 86px; margin: 0 auto 4px; padding: 14px; border-radius: 28px; background: linear-gradient(145deg, rgba(255, 255, 255, .16), rgba(255, 255, 255, .03)); border: 1px solid rgba(255, 255, 255, .2); box-shadow: 0 0 0 6px rgba(245, 197, 66, .08), 0 18px 40px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .25); animation: glowPulse 4s ease-in-out infinite; }
@keyframes glowPulse { 50% { box-shadow: 0 0 0 10px rgba(245, 197, 66, .12), 0 18px 50px rgba(245, 197, 66, .25), inset 0 1px 0 rgba(255, 255, 255, .25); } }
.logo h1 { margin: 6px 0 2px; font: 800 clamp(34px, 9vw, 46px)/1.05 var(--serif); letter-spacing: -.01em; background: linear-gradient(180deg, #fff 10%, #ffe08a 55%, #e0a21a); -webkit-background-clip: text; background-clip: text; color: transparent; }
:root[data-theme="light"] .logo h1 { background: linear-gradient(180deg, #2a3560, #b57d00); -webkit-background-clip: text; background-clip: text; }
.logo .tagline { margin: 0; color: var(--muted); font-size: 15px; }
.continue { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 20px; text-align: left; border-color: rgba(245, 197, 66, .45); background: linear-gradient(90deg, rgba(245, 197, 66, .18), rgba(245, 197, 66, .04)); }
.c-ic { width: 42px; height: 42px; border-radius: 14px; background: var(--accent); color: #1d1500; display: grid; place-items: center; } .c-ic svg { width: 20px; height: 20px; fill: currentColor; }
.c-tx { flex: 1; display: flex; flex-direction: column; } .c-tx small { color: var(--muted); } .c-go { color: var(--muted); }
.mode-cards { display: flex; flex-direction: column; gap: 14px; }
.mode-card { position: relative; overflow: hidden; display: flex; align-items: center; gap: 14px; min-height: 124px; padding: 16px 18px; border-radius: 26px; text-align: left; color: var(--text); border: 1px solid rgba(255, 255, 255, .16); background: linear-gradient(135deg, rgba(110, 135, 255, .3), rgba(110, 135, 255, .05) 70%); box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .18); transition: transform .2s, box-shadow .2s; }
.mode-card.fr { background: linear-gradient(135deg, rgba(245, 197, 66, .3), rgba(245, 197, 66, .04) 70%); }
.mode-card:hover { transform: translateY(-3px); } .mode-card:active { transform: scale(.985); }
.mode-card::after { content: ''; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 255, 255, .16), transparent 70%); }
.mc-art { position: relative; width: 104px; height: 88px; flex: none; }
.mc-art > svg { position: absolute; left: 0; top: 4px; width: 80px; height: 80px; }
.mc-art2 { position: absolute; left: 34px; top: 0; width: 70px; height: 70px; }
.mc-art2 svg { width: 100%; height: 100%; transform: scaleX(-1); }
.fr .mc-art2 svg { transform: none; }
.mc-tx { flex: 1; min-width: 0; } .mc-tx h2 { margin: 0 0 4px; font-size: 20px; letter-spacing: -.01em; } .mc-tx p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.35; }
.mc-go { color: var(--muted); }
.home-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
.home-grid .tile { grid-column: span 2; }
.home-grid .tile:nth-child(4):nth-last-child(2), .home-grid .tile:nth-child(5):last-child { grid-column: span 3; }
.tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 84px; padding: 10px 6px; border-radius: 20px; font-size: 13px; font-weight: 650; text-align: center; transition: transform .15s; }
.tile:hover { transform: translateY(-2px); } .tile:active { transform: scale(.96); }
.tile svg { width: 26px; height: 26px; color: var(--accent2); }
.tile.accent svg { color: var(--accent); }
.foot { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; color: var(--muted); font-size: 13px; padding-top: 6px; }
.foot a { color: var(--accent2); text-decoration: none; font-weight: 600; } .foot b { color: var(--text); } .dot { opacity: .5; }

/* ===================== GAME LAYOUT ===================== */
#game { overflow: hidden; display: flex; flex-direction: column; }
.g-head { flex: none; display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; gap: 8px; padding: 8px 10px 4px; }
.g-title { text-align: center; line-height: 1.2; min-width: 0; }
.g-mode { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-open { font-size: 12px; color: var(--accent); min-height: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-main { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; padding: 0 10px 10px; }
.g-col { flex: none; display: flex; flex-direction: column; gap: 6px; align-self: center; width: 100%; max-width: calc(var(--bs, 340px) + 44px); }
.g-side { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; max-width: 560px; width: 100%; align-self: center; }
.side-open { display: none; font-size: 14px; color: var(--accent); font-weight: 650; }
.bwrap { position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; height: calc(var(--bs, 320px) + 14px); flex: none; }
.bhost { position: relative; width: var(--bs, 320px); height: var(--bs, 320px); flex: none; }
.pbar { display: flex; align-items: center; gap: 10px; min-height: 54px; padding: 6px 10px; border-radius: 16px; transition: box-shadow .3s, border-color .3s; }
.pbar.active { border-color: rgba(245, 197, 66, .7); box-shadow: 0 0 0 1px rgba(245, 197, 66, .5), 0 0 26px rgba(245, 197, 66, .22); }
.pbar.rot { transform: rotate(180deg); }
.pb-av { width: 38px; height: 38px; padding: 5px; border-radius: 50%; flex: none; background: linear-gradient(145deg, #3a4468, #1a2038); border: 1px solid var(--stroke); }
.pb-av.w { background: linear-gradient(145deg, #7f8aae, #3a4468); }
.pb-mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.pb-name { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 8px; }
.turn-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: blink 1.2s ease-in-out infinite; flex: none; }
@keyframes blink { 50% { opacity: .25; transform: scale(.7); } }
.pb-sub { min-height: 18px; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.caps { display: inline-flex; align-items: center; flex-wrap: nowrap; } .cap-grp { display: inline-flex; margin-right: 6px; }
.caps svg { width: 17px; height: 17px; margin-right: -7px; filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .4)); }
.adv { font-weight: 800; color: var(--text); background: var(--panel2); padding: 0 6px; border-radius: 8px; }
.thinking { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); }
.thinking i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: dots 1s infinite; }
.thinking i:nth-child(2) { animation-delay: .15s; } .thinking i:nth-child(3) { animation-delay: .3s; }
.thinking b { margin-left: 4px; font-weight: 600; }
@keyframes dots { 0%, 80%, 100% { transform: translateY(0); opacity: .4; } 40% { transform: translateY(-4px); opacity: 1; } }
.pb-acts { display: flex; gap: 6px; }
.mini { width: 36px; height: 36px; border-radius: 11px; border: 1px solid var(--stroke); background: var(--panel2); font-weight: 800; font-size: 15px; }
.pb-clock { font: 700 22px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; padding: 9px 12px; border-radius: 12px; background: rgba(0, 0, 0, .28); min-width: 78px; text-align: center; }
:root[data-theme="light"] .pb-clock { background: rgba(30, 40, 80, .09); }
.pb-clock.run { background: rgba(245, 197, 66, .2); color: var(--accent); } .pb-clock.low { color: #fff; background: var(--bad); animation: lowp 1s infinite; }
@keyframes lowp { 50% { filter: brightness(1.3); } }
.moves { flex: 1; min-height: 56px; overflow: auto; border-radius: 16px; padding: 8px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 2px 4px; }
.mv-row { display: inline-flex; align-items: center; gap: 2px; margin-right: 6px; } .mv-row .mn { color: var(--muted); font-size: 12px; width: 26px; text-align: right; margin-right: 2px; flex: none; }
.mvb { border: 0; background: transparent; padding: 7px 8px; border-radius: 9px; font-weight: 650; font-size: 14px; min-height: 34px; }
.mvb:hover { background: var(--panel2); } .mvb.on { background: var(--accent); color: #1d1500; }
.mv-empty { color: var(--muted); font-size: 14px; padding: 6px; }
.mvb.mk-best::after { content: ' ★'; color: #5aa2ff; font-size: 11px; } .mvb.mk-inacc::after { content: ' ?!'; color: #e8c547; } .mvb.mk-mistake::after { content: ' ?'; color: #f08a24; } .mvb.mk-blunder::after { content: ' ??'; color: #ff5a5f; }
.mvb.on::after { color: #1d1500 !important; }
.view-banner { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px; border-radius: 14px; background: rgba(123, 147, 255, .2); border: 1px solid rgba(123, 147, 255, .5); font-size: 14px; font-weight: 600; }
.actions { display: flex; gap: 6px; flex: none; }
.act { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; padding: 6px 2px; border-radius: 16px; border: 1px solid var(--stroke); background: var(--panel); font-size: 11.5px; font-weight: 650; transition: transform .12s, background .2s; }
.act:hover:not(:disabled) { background: var(--panel2); } .act:active:not(:disabled) { transform: scale(.95); }
.act .ai { font-size: 18px; font-weight: 800; line-height: 1; display: grid; place-items: center; height: 22px; } .act .ai svg { width: 22px; height: 22px; }
.act .al { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.act.primary:not(:disabled) { background: linear-gradient(180deg, #ffd666, var(--accent-d)); color: #1d1500; border-color: transparent; }
.confirm-bar { position: absolute; left: 50%; bottom: -2px; transform: translateX(-50%); z-index: 30; display: flex; gap: 8px; padding: 8px; border-radius: 18px; background: var(--panel-solid); border: 1px solid var(--stroke); box-shadow: var(--shadow); }
@media (min-width: 900px) and (min-aspect-ratio: 11/10) {
  .g-main { flex-direction: row; justify-content: center; align-items: flex-start; gap: 22px; padding: 4px 22px 18px; }
  .g-col { align-self: flex-start; width: auto; max-width: none; }
  .g-side { width: 360px; flex: none; align-self: stretch; max-width: 360px; }
  .side-open { display: block; }
  .g-open { display: none; }
  .moves { font-size: 15px; }
}

/* ===================== BOARD ===================== */
.board { position: absolute; inset: 0; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 6px var(--frame), 0 0 0 7px rgba(255, 255, 255, .12), 0 22px 50px rgba(0, 0, 0, .5); touch-action: none; user-select: none; -webkit-user-select: none; background: var(--sq-d); }
.board.shake { animation: shake .35s; }
@keyframes shake { 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }
.sq-layer { position: absolute; inset: 0; }
.sq-layer::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(95deg, rgba(0, 0, 0, .028) 0 2px, transparent 2px 9px), linear-gradient(160deg, rgba(255, 255, 255, .1), transparent 40%, rgba(0, 0, 0, .12)); }
.sq { position: absolute; width: 12.5%; height: 12.5%; background-image: linear-gradient(135deg, rgba(255, 255, 255, .07), rgba(0, 0, 0, .07)); }
.sq.l { background-color: var(--sq-l); } .sq.d { background-color: var(--sq-d); }
.sq i { position: absolute; font: 700 calc(var(--bs, 320px) / 8 * .17)/1 var(--font); font-style: normal; pointer-events: none; z-index: 4; opacity: .9; }
.sq .cr { top: 5%; left: 6%; } .sq .cf { right: 6%; bottom: 4%; }
.sq.l i { color: var(--sq-d); } .sq.d i { color: var(--sq-l); }
:root[data-coords="0"] .sq i { display: none; }
.sq::before, .sq::after { content: ''; position: absolute; pointer-events: none; }
.sq::before { inset: 0; }
.sq.last::before { background: rgba(255, 187, 30, .46); }
.sq.sel::before { background: rgba(60, 135, 255, .52); box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .55); }
.sq.premove::before { background: rgba(50, 170, 255, .5); box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .5); }
.sq.pend::before { background: rgba(60, 200, 150, .55); box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .6); }
.sq.hint::before { background: rgba(165, 110, 255, .55); animation: hintp 1s ease-in-out infinite; box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .7), 0 0 18px rgba(165, 110, 255, .9); }
@keyframes hintp { 50% { filter: brightness(1.45); } }
.sq.incheck::before { background: radial-gradient(circle at center, rgba(255, 30, 40, .95) 0, rgba(255, 30, 40, .65) 32%, rgba(255, 30, 40, .0) 72%); animation: checkp 1.05s ease-in-out infinite; }
@keyframes checkp { 50% { opacity: .55; transform: scale(1.08); } }
.sq.goal::before { box-shadow: inset 0 0 0 4px var(--accent), inset 0 0 22px rgba(245, 197, 66, .9); background: rgba(245, 197, 66, .22); animation: hintp 1.1s infinite; }
.sq.gold::before { background: radial-gradient(circle, rgba(255, 215, 90, .95) 0, rgba(255, 190, 30, .6) 38%, transparent 74%); animation: checkp 1.2s ease-in-out infinite; }

<script id="engine">
/* =====================================================================
   ENGINE  (board state · move generator · rules · SAN/FEN/PGN · AI search)
   Plain ES5-style JS so it can run on the main thread AND inside the
   inline-Blob Web Worker.
   Board: 0x88 (sq = rank*16 + file, rank 0 = rank 1). Piece = type | colour<<3
   ===================================================================== */
var PIECE_CH = '.PNBRQK';
var FILES = 'abcdefgh';
var P_ = 1, N_ = 2, B_ = 3, R_ = 4, Q_ = 5, K_ = 6;
var KN_OFF = [33, 31, 18, 14, -14, -18, -31, -33];
var KG_OFF = [1, -1, 16, -16, 17, 15, -17, -15];
var B_OFF = [17, 15, -17, -15];
var R_OFF = [1, -1, 16, -16];
var CASTMASK = new Uint8Array(128);
for (var _i = 0; _i < 128; _i++) CASTMASK[_i] = 15;
CASTMASK[0] = 13; CASTMASK[7] = 14; CASTMASK[4] = 12;
CASTMASK[112] = 7; CASTMASK[119] = 11; CASTMASK[116] = 3;
var F_CAP = 1, F_EP = 2, F_CASTLE = 4, F_DP = 8;

function sqName(s) { return FILES[s & 7] + ((s >> 4) + 1); }
function sqFromName(n) { return (n.charCodeAt(1) - 49) * 16 + (n.charCodeAt(0) - 97); }
function mkMove(from, to, promo, flag) { return from | (to << 7) | (promo << 14) | (flag << 17); }
function mFrom(m) { return m & 127; }
function mTo(m) { return (m >> 7) & 127; }
function mPromo(m) { return (m >> 14) & 7; }
function mFlag(m) { return m >> 17; }

/* ---------- Zobrist (deterministic) ---------- */
var Z = (function () {
  var s = 0x9e3779b9;
  function rnd() { s |= 0; s = (s + 0x6D2B79F5) | 0; var t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return (t ^ (t >>> 14)) | 0; }
  var p = [], i, j;
  for (i = 0; i < 16; i++) { p[i] = new Int32Array(128); for (j = 0; j < 128; j++) p[i][j] = rnd(); }
  var c = new Int32Array(16); for (i = 0; i < 16; i++) c[i] = rnd();
  var e = new Int32Array(129); for (i = 1; i < 129; i++) e[i] = rnd();
  return { p: p, c: c, e: e, side: rnd() };
})();

/* ---------- Position ---------- */
function Position() {
  this.b = new Int8Array(128);
  this.side = 0; this.cast = 0; this.ep = -1; this.half = 0; this.full = 1;
  this.ks = [-1, -1]; this.n = 0; this.hash = 0;
  this.hM = new Int32Array(2048); this.hC = new Int8Array(2048); this.hCast = new Uint8Array(2048);
  this.hEp = new Int16Array(2048); this.hHalf = new Int16Array(2048); this.hH = new Int32Array(2048);

/* ---------- clock ---------- */
function timed() { return G && (G.clock.w > 0 || G.clock.inc > 0); }
function startClock() {
  if (!timed() || G.over) return;

}

}

    e.classList.toggle('low', ms < 30000 || (G.clock.w > 0 && ms < G.clock.w * 0.1 && ms < 60000));
    e.classList.toggle('run', G.clock.on && G.pos.side === c && !G.over);

}

  else end({ result: winner ? '0-1' : '1-0', reason: 'timeout', winner: winner });
}

/* ---------- user move entry ---------- */

function onUserMove(from, to) {

  clearPending();
  var L = G.pos.legal().filter(function (m) { return (m & 127) === from && ((m >> 7) & 127) === to; });
  if (!L.length) { GB.shake(); Snd.play('error'); return false; }
  var col = G.pos.side;
  function commit(m) {
    if (SET.confirm) { G.pending = m; GB.setPending([from, to]); $('#confirmBar').hidden = false; Snd.play('click'); }
    else playMove(m, 'human');

  if (L.length > 1) {
    var q = L.filter(function (m) { return ((m >> 14) & 7) === 5; })[0];
    if (SET.autoQueen) commit(q);
    else GB.askPromotion(col, to, function (pt) { if (!pt) return; commit(L.filter(function (m) { return ((m >> 14) & 7) === pt; })[0]); });
  } else commit(L[0]);
  return true;
}

/* ---------- core: play a move ---------- */
function playMove(m, by, silent) {
  var pos = G.pos, from = m & 127, to = (m >> 7) & 127, fl = m >> 17, promo = (m >> 14) & 7, mover = pos.side;
  var san = pos.san(m), capCode = (fl & F_EP) ? (1 | ((1 - mover) << 3)) : pos.b[to];
  G.clkHist.push({ w: G.clock.w, b: G.clock.b });
  pos.make(m);
  G.moves.push(m); G.ucis.push(uciOf(m)); G.sans.push(san); G.fens.push(pos.fen()); G.caps.push(capCode); G.capBy.push(mover);
  if (fl & F_CASTLE) G.flags.castled[mover] = 1;
  if (promo) G.flags.promoted[mover] = 1;
  if (fl & F_EP) G.flags.ep[mover] = 1;
  if (!silent) {
    G.view = -1; clearPending();
    if (timed()) { if (G.moves.length > 1) G.clock[mover ? 'b' : 'w'] += G.clock.inc; if (!G.clock.on) startClock(); G.clock.t0 = performance.now(); lastBeep = -1; }

  var chk = pos.inCheck(pos.side), hasMoves = pos.hasLegal(), over = null;
  if (!hasMoves) over = chk ? { result: mover ? '0-1' : '1-0', reason: 'checkmate', winner: mover } : { result: '1/2-1/2', reason: 'stalemate' };
  else if (pos.insufficient()) over = { result: '1/2-1/2', reason: 'insufficient' };
  else if (pos.repetitions() >= 3) over = { result: '1/2-1/2', reason: 'repetition' };
  else if (pos.half >= 100) over = { result: '1/2-1/2', reason: 'fifty' };
  if (silent) { if (over) G.over = over; return; }

  var snd = over && over.reason === 'checkmate' ? 'mate' : chk ? 'check' : promo ? 'promote' : (fl & F_CASTLE) ? 'castle' : (fl & F_CAP) ? 'capture' : 'move';
  if (!(over && over.reason !== 'checkmate')) Snd.play(snd);
  haptic(over ? [30, 40, 60] : (fl & F_CAP) ? 28 : 12);
  GB.setPosition(pos, { move: m, last: [from, to] });
  var sr = $('#sr'); if (sr) sr.textContent = san;
  if (G.mode === 'friend' && G.orientMode === 'auto' && !over) setTimeout(function () { if (G && !G.over) { G.orientNow = G.pos.side; GB.setOrient(G.orientNow); renderBars(); } }, SET.anim === 'off' ? 0 : 420);
  renderAll();
  if (over) { end(over); return; }
  saveGame();

}

/* ---------- AI ---------- */
function maybeAI() {

    var wait = Math.max(0, 520 - (Date.now() - t0));
    setTimeout(function () {
      if (!G || G.id !== gid || G.aiTok !== tok || G.over) return;
      G.aiBusy = false;

      var m = G.pos.parseUCI(r.move);

    }, wait);
  });
}
function tryPremove() {
  if (!G || !G.premove || G.over) { if (G) G.premove = null; if (GB) GB.setPremove(null); return; }
  var pm = G.premove; G.premove = null; GB.setPremove(null);
  setTimeout(function () {
    if (!G || G.over || G.pos.side !== G.human) return;
    var L = G.pos.legal().filter(function (m) { return (m & 127) === pm[0] && ((m >> 7) & 127) === pm[1]; });
    if (!L.length) return;
    var m = L.filter(function (x) { return ((x >> 14) & 7) === 5; })[0] || L[0];

}

/* ---------- evaluation bar + hint ---------- */

    if (!G || G.id !== gid || tok !== evalToken || r.cancelled) return;

}
function setEvalBar(cp) {

  else { pct = 50 + 50 * (2 / (1 + Math.exp(-cp / 330)) - 1); txt = (cp >= 0 ? '+' : '−') + (Math.abs(cp) / 100).toFixed(1); }
  var f = $('#evFill'); if (!f) return;
  $('#evalbar').classList.toggle('flip', !!G.orientNow);
  f.style.height = pct + '%'; $('#evTxt').textContent = txt;

}

/* ---------- view history ---------- */

}

/* ---------- actions ---------- */

/* ---------- end of game ---------- */

}

function defStats() {

}
function getStats() { var s = store.get('stats', null); if (!s || !s.ai) s = defStats(); LEVEL_KEYS.forEach(function (k) { if (!s.ai[k]) s.ai[k] = { w: 0, l: 0, d: 0 }; }); return s; }

function grant(id) {
  var a = store.get('ach', {});
  if (a[id]) return false;
  a[id] = Date.now(); store.set('ach', a);
  toast('🏅 ' + t('achUnlocked') + ': ' + t('ach_' + id), 'ach'); Snd.play('ok');
  return true;
}
function recordResult(o) {
  var s = getStats(), draw = o.result === '1/2-1/2', plies = G.moves.length;
  var humanWon = false;
  if (G.mode === 'ai') {
    var r = draw ? 'd' : (o.winner === G.human ? 'w' : 'l'); humanWon = r === 'w';
    s.ai[G.level][r]++;
    if (r === 'w') { s.streak++; if (s.streak > s.best) s.best = s.streak; } else if (r === 'l') s.streak = 0;
  } else {
    if (draw) s.friend.d++; else if (o.winner === 0) s.friend.w++; else s.friend.b++;
  }
  store.set('stats', s);
  /* achievements */
  if (G.mode === 'ai') {
    if (humanWon) {
      grant('first_win');
      if (o.reason === 'checkmate' && Math.ceil(plies / 2) < 20) grant('mate20');
      if (G.level === 'expert') grant('beat_expert');
      if (G.level === 'hard' || G.level === 'expert') grant('beat_hard');
    }
    if (s.streak >= 10) grant('streak10');
  } else grant('friend_game');
  var fl = G.flags;
  if (G.mode === 'ai' ? fl.castled[G.human] : (fl.castled[0] || fl.castled[1])) grant('castler');
  if (G.mode === 'ai' ? fl.promoted[G.human] : (fl.promoted[0] || fl.promoted[1])) grant('promoter');
  if (G.mode === 'ai' ? fl.ep[G.human] : (fl.ep[0] || fl.ep[1])) grant('enpassant');
  if (draw) grant('draw_game');
  if (plies >= 80) grant('marathon');
}

function buildPGN(rec) {

  var tmp = new Position().loadFEN(rec.startFen), num = fenFullMove(rec.startFen), body = '', i;
  for (i = 0; i < rec.sans.length; i++) {
    if (tmp.side === 0) body += num + '. '; else if (i === 0) body += num + '... ';
    body += rec.sans[i] + ' ';

}
function parsePGN(text) {

    m = pos.parseSAN(toks[i]);

function recordFromText(text) {

function puzTry(m) {
  var pos = P.pos, mates = findMates(pos, P.left);
  if (mates.indexOf(m) < 0) { P.tries++; PB.shake(); Snd.play('error'); haptic([20, 40, 20]); puzMsg(t('puzWrong'), 'bad'); PB.setHint(null); return; }
  pos.make(m);
  PB.setPosition(pos, { move: m, last: [m & 127, (m >> 7) & 127] });
  if (!pos.hasLegal() && pos.inCheck(pos.side)) {
    P.done = true; Snd.play('mate'); setTimeout(function () { Snd.play('win'); }, 500);
    var s = store.get('puz', { solved: {} }); s.solved[P.idx] = 1; store.set('puz', s); checkPuzzleAch();
    puzMsg(t('puzSolved'), 'good'); Confetti.burst(); PB.setGlow(pos.ks[pos.side ^ 1]);
    return;
  }
  Snd.play(pos.inCheck(pos.side) ? 'check' : 'move');
  P.busy = true; puzMsg(t('puzGood'), 'good');
  setTimeout(function () {
    if (!P) return;
    var Rr = pos.legal(), best = null, bs = 1e9, i, r, cnt;
    for (i = 0; i < Rr.length; i++) { pos.make(Rr[i]); cnt = findMates(pos, P.left - 1).length; pos.unmake(); cnt += Math.random() * 0.5; if (cnt < bs) { bs = cnt; best = Rr[i]; } }
    r = best; pos.make(r); P.left--; P.busy = false;
    PB.setPosition(pos, { move: r, last: [r & 127, (r >> 7) & 127] }); Snd.play((r >> 17) & F_CAP ? 'capture' : 'move');
    puzMsg(t('puzYourTurn'), '');
  }, 650);
}
function puzHint() {
  if (!P || P.done || P.busy) return;
  var mates = findMates(P.pos, P.left); if (!mates.length) return;
  var m = mates[0]; P.hint++;
  if (P.hint === 1) { PB.setGlow(m & 127); puzMsg(t('puzHint1'), ''); } else { PB.setGlow(-1); PB.setHint([m & 127, (m >> 7) & 127]); puzMsg(t('puzHint2'), ''); }
  Snd.play('ok');
}

function lessonMove(from, to) {

    else if (tk.to) ok = sqName((m >> 7) & 127) === tk.to;

var CLS = ['best', 'good', 'inacc', 'mistake', 'blunder'];
function openReview(rec) {

  tmp = new Position().loadFEN(rec.startFen); fens.push(tmp.fen());
  for (i = 0; i < rec.ucis.length; i++) { m = tmp.parseUCI(rec.ucis[i]); last.push([m & 127, (m >> 7) & 127]); tmp.make(m); fens.push(tmp.fen()); }
  if (R) R.tok++;
  R = { rec: rec, fens: fens, last: last, i: fens.length - 1, ev: [], best: [], marks: [], tok: 0, done: 0, orient: rec.orient || 0 };
  var head = rec.names[0] + ' – ' + rec.names[1] + (rec.result && rec.result !== '*' ? ' · ' + rec.result : '');

    '<div class="bwrap" id="rvWrap"><div class="bhost" id="rvBoard"></div></div>' +

    '<div class="moves glass" id="rvMoves"></div><div class="rv-sum glass" id="rvSum"></div>' +
    '<div class="actions two"><button class="act" data-n="play"><span class="ai">' + ICON.play + '</span><span class="al">' + esc(t('playFromHere')) + '</span></button><button class="act" data-n="pgn"><span class="ai">' + ICON.copy + '</span><span class="al">' + esc(t('pgnFen')) + '</span></button></div></aside></div>';
  if (RB) RB.destroy();

  body.onclick = function (e) {

    if (k === 'first') reviewGo(0); else if (k === 'prev') reviewGo(R.i - 1); else if (k === 'next') reviewGo(R.i + 1); else if (k === 'last') reviewGo(R.fens.length - 1);

}
function reviewAbort() { if (R) { R.tok++; } if (AN) AN.cancel(); }
function reviewGo(i, silent) {
  if (!R) return; i = clamp(i, 0, R.fens.length - 1); R.i = i;
  var pos = new Position().loadFEN(R.fens[i]);
  RB.setPosition(pos, { last: R.last[i] });

}
function reviewRender() {
  var n = R.fens.length - 1, i = R.i, info = '', j = i - 1;
  if (i === 0) info = '<b>' + esc(t('startPos')) + '</b>';
  else {
    var mk = R.marks[j];
    info = '<b>' + (Math.floor((j + (R.fens[0].split(' ')[1] === 'b' ? 1 : 0)) / 2) + 1) + (((j + (R.fens[0].split(' ')[1] === 'b' ? 1 : 0)) % 2) ? '… ' : '. ') + esc(R.rec.sans[j]) + '</b>';
    if (mk) {
      info += ' <span class="tag ' + mk + '">' + esc(t('cls_' + mk)) + '</span>';
      if (mk !== 'best' && R.best[j]) { var bp = new Position().loadFEN(R.fens[j]), bm = bp.parseUCI(R.best[j]); if (bm) info += '<small>' + esc(t('bestWas', { m: bp.san(bm) })) + '</small>'; }
    }
  }
  var op = openingName(R.rec.sans.slice(0, i)); if (op) info += '<small class="op">♞ ' + esc(op) + '</small>';
  $('#rvInfo').innerHTML = info;
  var start = R.fens[0].split(' ')[1] === 'b' ? 1 : 0;
  renderMoveList($('#rvMoves'), R.rec.sans, i, R.marks, start);
  var pct = R.done / (n + 1) * 100;
  $('#rvProg').innerHTML = R.done < n + 1 ? '<span>' + esc(t('analyzing', { a: R.done, b: n + 1 })) + '</span><div class="bar"><i style="width:' + pct + '%"></i></div>' : '';
  drawGraph();

function drawGraph() {
  var g = $('#rvGraph'), n = R.fens.length - 1, h = '<line x1="0" y1="35" x2="300" y2="35" class="g-base"/>';
  if (n >= 1 && R.ev.length) {
    var pts = [], k, x, y, d = 'M0 35';
    for (k = 0; k <= n; k++) { if (R.ev[k] === undefined) break; x = k / n * 300; y = 35 - R.ev[k] / 1000 * 32; pts.push([x, y]); }
    if (pts.length > 1) {
      d = 'M' + pts[0][0] + ' 35'; pts.forEach(function (p) { d += 'L' + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }); d += 'L' + pts[pts.length - 1][0].toFixed(1) + ' 35Z';
      h += '<path d="' + d + '" class="g-area"/>';
      h += '<polyline points="' + pts.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ') + '" class="g-line" fill="none"/>';

function drawSummary() {

  for (j = 0; j < R.marks.length; j++) if (R.marks[j]) { c[(j + side0) % 2][R.marks[j]]++; any = true; }

async function reviewRun() {
  var tok = ++R.tok, N = R.fens.length - 1, i, p, r;

    else {
      r = await AN.ask({ fen: R.fens[i], moves: [], depth: 5, ms: 260 });
      if (!R || R.tok !== tok || r.cancelled) return;

function reviewPlayFrom() {

/* =====================================================================
   MAIN: init · keyboard · lifecycle · service worker
   ===================================================================== */
function inField(e) { var n = e.target; return n && (n.tagName === 'INPUT' || n.tagName === 'TEXTAREA' || n.isContentEditable); }
document.addEventListener('keydown', function (e) {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Escape') {
    if (Dlg.closeTop()) { e.preventDefault(); return; }
    if (GB && GB.promoEl) { GB.cancelPromotion(); return; }
    if (curScreen === 'game' && G) { GB.clearSel(); if (G.pending) clearPending(); if (G.premove) { G.premove = null; GB.setPremove(null); } GB.setHint(null); }
    return;
  }
  if (inField(e) || Dlg.stack.length) return;
  var k = e.key.toLowerCase();
  if (curScreen === 'game' && G) {
    if (k === 'u') { undo(); e.preventDefault(); }
    else if (k === 'f') { flipBoard(); e.preventDefault(); }
    else if (k === 'h' && (isAI() ? SET.aiHint : SET.friendHint)) { doHint(); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { stepView(-1); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { stepView(1); e.preventDefault(); }
    else if (e.key === 'Home') { viewJump(0); e.preventDefault(); }
    else if (e.key === 'End') { viewJump(-1); e.preventDefault(); }
  } else if (curScreen === 'review' && R) {
    if (e.key === 'ArrowLeft') { reviewGo(R.i - 1); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { reviewGo(R.i + 1); e.preventDefault(); }
    else if (e.key === 'Home') { reviewGo(0); e.preventDefault(); }
    else if (e.key === 'End') { reviewGo(R.fens.length - 1); e.preventDefault(); }
    else if (k === 'f') { R.orient = R.orient ? 0 : 1; RB.setOrient(R.orient); }
  }
});

function persistNow() { try { if (G && !G.over && curScreen === 'game') saveGame(); } catch (e) { } }
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') persistNow(); });
window.addEventListener('pagehide', persistNow);

    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { }); });
  }
})();
